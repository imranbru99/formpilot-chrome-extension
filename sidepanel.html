<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4f0;
      --bg-elevated: #ffffff;
      --ink: #1a1c1e;
      --muted: #6b7280;
      --line: #e8e4dc;
      --accent: #0d9488;
      --accent-deep: #0f766e;
      --accent-soft: #ccfbf1;
      --danger: #e11d48;
      --danger-soft: #ffe4e6;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --ok: #059669;
      --shadow: 0 1px 2px rgba(26, 28, 30, 0.04), 0 8px 24px rgba(26, 28, 30, 0.06);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      background:
        radial-gradient(120% 80% at 0% 0%, #d1fae5 0%, transparent 45%),
        radial-gradient(90% 60% at 100% 0%, #fef3c7 0%, transparent 40%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 20px 16px 28px;
      -webkit-font-smoothing: antialiased;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--accent) 0%, var(--accent-deep) 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(13, 148, 136, 0.35);
      flex-shrink: 0;
    }

    .logo svg { width: 20px; height: 20px; color: #fff; }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .brand p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-head .card-label { margin-bottom: 0; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(145deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
      margin-bottom: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 6px 18px rgba(13, 148, 136, 0.45);
    }

    .btn-primary.is-running {
      opacity: 1;
      background: linear-gradient(145deg, #14b8a6 0%, var(--accent) 100%);
    }

    .btn-ghost {
      background: #fafaf8;
      color: var(--ink);
      border: 1px solid var(--line);
      margin-bottom: 8px;
    }

    .btn-ghost:hover:not(:disabled) { background: #f3f1ec; }

    .btn-stop {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecdd3;
    }

    .btn-stop:hover:not(:disabled) { background: #fecdd3; }

    .btn-stop:disabled {
      background: #fafaf8;
      color: var(--muted);
      border-color: var(--line);
    }

    .btn-link {
      width: auto;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-deep);
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-link:hover { text-decoration: underline; }

    .btn-sm {
      width: auto;
      padding: 8px 12px;
      font-size: 0.8125rem;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sm:hover { background: var(--accent-deep); }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fafaf8;
      border: 1px solid var(--line);
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink);
      min-height: 48px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-top: 5px;
      flex-shrink: 0;
    }

    .status.is-active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      animation: pulse 1.4s ease infinite;
    }

    .status.is-ok .status-dot { background: var(--ok); box-shadow: 0 0 0 4px #d1fae5; }
    .status.is-warn .status-dot { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
    .status.is-danger .status-dot { background: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px var(--accent-soft); }
      50% { box-shadow: 0 0 0 7px rgba(204, 251, 241, 0.35); }
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child { margin-bottom: 0; }

    .field label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .field .hint {
      font-size: 0.6875rem;
      color: var(--muted);
      font-weight: 500;
      margin-top: 5px;
      line-height: 1.35;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ink);
      background: #fafaf8;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: #fff;
    }

    input[type="number"] { max-width: 110px; }

    .unit {
      font-size: 0.8125rem;
      color: var(--muted);
      font-weight: 500;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      min-height: 28px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px 5px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-size: 0.75rem;
      font-weight: 600;
      max-width: 100%;
    }

    .chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip button {
      border: none;
      background: transparent;
      color: var(--accent-deep);
      cursor: pointer;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      opacity: 0.7;
      font-family: inherit;
    }

    .chip button:hover {
      opacity: 1;
      background: rgba(15, 118, 110, 0.12);
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    .settings-body { display: none; }
    .settings-body.open { display: block; }

    .saved-toast {
      font-size: 0.6875rem;
      color: var(--ok);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .saved-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
    </div>
    <div>
      <h1>FormPilot</h1>
      <p>Universal form automation</p>
    </div>
  </header>

  <section class="card">
    <div class="card-label">Quick action</div>
    <button id="fillBtn" class="btn btn-ghost" type="button">Fill this page</button>
  </section>

  <section class="card">
    <div class="card-label">Auto loop</div>
    <button id="runBtn" class="btn btn-primary" type="button">Start loop</button>
    <button id="stopBtn" class="btn btn-stop" type="button" disabled>Stop</button>
  </section>

  <div id="status" class="status" role="status">
    <span class="status-dot"></span>
    <span id="statusText">Ready — open a form and start.</span>
  </div>

  <section class="card">
    <div class="card-head">
      <div class="card-label">Settings</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="savedToast" class="saved-toast">Saved</span>
        <button id="toggleSettings" class="btn-link" type="button">Show</button>
      </div>
    </div>

    <div id="settingsBody" class="settings-body">
      <div class="field">
        <label for="waitSeconds">Wait after Next</label>
        <div class="field-row">
          <input id="waitSeconds" type="number" min="1" max="60" step="0.5" value="4.5">
          <span class="unit">seconds</span>
        </div>
        <p class="hint">Delay before filling the next page (default 4.5).</p>
      </div>

      <div class="field">
        <label>Stop words (verification / basic check)</label>
        <div id="wordChips" class="chips"></div>
        <div class="add-row">
          <input id="wordInput" type="text" placeholder="Add word or phrase…" autocomplete="off">
          <button id="addWordBtn" class="btn-sm" type="button">Add</button>
        </div>
        <p class="hint">If any of these appear on the page, the loop auto-stops. Click × to remove.</p>
      </div>

      <button id="resetSettings" class="btn btn-ghost" type="button" style="margin-bottom:0;margin-top:4px;">Reset to defaults</button>
    </div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
